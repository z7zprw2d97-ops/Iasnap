<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Iasnap — Messagerie chiffrée & IA</title>
  <meta name="description" content="Iasnap — Messagerie chiffrée de bout en bout avec agents IA. Confidentialité, sécurité et communications privées en temps réel." />
  <meta name="keywords" content="messagerie chiffrée, e2ee, IA, agent IA, communication sécurisée, confidentialité, WSS, WebSocket, libsodium, sécurité" />

  <!-- Open Graph -->
  <meta property="og:title" content="Iasnap — Messagerie chiffrée & IA" />
  <meta property="og:description" content="Messagerie chiffrée de bout en bout avec intégration d'agents IA. Conçu pour la confidentialité et la simplicité." />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">Iasnap <small>🔐</small></h1>
      <p class="tagline">Messagerie chiffrée de bout en bout • Agents IA • Privé par conception</p>
    </div>
  </header>

  <main class="container main-grid">
    <section class="card auth-card">
      <h2>Connexion</h2>

      <label for="identifiant">Identifiant</label>
      <input id="identifiant" placeholder="votre-identifiant" value="humain" />

      <label for="jeton">Jeton d'accès</label>
      <input id="jeton" type="password" placeholder="Jeton d'accès secret" />

      <div class="row">
        <button id="connecter" class="btn primary">Se connecter</button>
        <div id="statut" class="status">🔴 Déconnecté</div>
      </div>

      <p class="help">Conseil : générez un jeton côté serveur et conservez-le en sécurité. La clé privée du client est stockée localement.</p>
    </section>

    <section class="card chat-card">
      <h2>Conversation</h2>

      <label for="destinataire">Destinataire</label>
      <select id="destinataire">
        <option>Aucun agent connecté</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" placeholder="Votre message... (texte libre)"></textarea>

      <div class="row">
        <button id="envoyer" class="btn accent">🔒 Envoyer</button>
        <button id="clear" class="btn ghost">Effacer</button>
      </div>

      <h3>Messages</h3>
      <div id="messages" class="messages" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© Iasnap — Confidentialité • Sécurité • IA</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.15/dist/modules/libsodium-wrappers.js"></script>
  <script type="module" src="/application.js"></script>
</body>
</html>
